name: Release

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Release date (YYYY-MM-DD); defaults to the UTC current date"
        required: false
        type: string
      dry_run:
        description: "Run the full release without pushing, tagging, or publishing"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-editors
      - name: Cache themis
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/vim-themis
          key: themis-v1.7.0-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            themis-v1.7.0-${{ runner.os }}-
      - name: Install themis
        timeout-minutes: 5
        run: make vendor/vim-themis/bin/themis
      - name: Resolve release date
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          date="${INPUT_DATE:-$(date -u +%F)}"
          if ! printf '%s' "$date" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "Invalid release date: $date" >&2
            exit 1
          fi
          echo "DATE=$date" >> "$GITHUB_ENV"
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Check changelog
        timeout-minutes: 5
        run: make check-changelog DATE=$DATE
      - name: Refresh, test, and commit
        timeout-minutes: 10
        run: make release DATE=$DATE
      # minimalist: dry_run gates each side-effecting step rather than a parallel path.
      - name: Push the release commit
        if: ${{ !inputs.dry_run }}
        run: git push origin HEAD:${{ github.event.repository.default_branch }}
      - name: Force-move the release tag
        if: ${{ !inputs.dry_run }}
        run: |
          git tag -f "$DATE"
          git push -f origin "$DATE"
      - name: Generate release notes
        if: ${{ !inputs.dry_run }}
        run: python3 tools/check_changelog.py "$DATE" --print-section > /tmp/notes.md
      - name: Publish the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$DATE" >/dev/null 2>&1; then
            gh release edit "$DATE" --title "$DATE" --notes-file /tmp/notes.md
          else
            gh release create "$DATE" --title "$DATE" --notes-file /tmp/notes.md
          fi
      - name: Show dry-run diff
        if: ${{ inputs.dry_run }}
        run: git --no-pager diff HEAD~1
