name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, for example v0.1.0"
        required: true

jobs:
  pin-guard:
    name: Pin guard
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail when the committed pin is behind upstream
        run: |
          latest=$(python3 -c "import sys; sys.path.insert(0, 'tools'); import refresh_map as r; print(r.select_latest_tag(r.fetch_tags())['name'])")
          pinned=$(python3 -c "import sys; sys.path.insert(0, 'tools'); import generate_map as g; print(g.SOURCE_TAG)")
          echo "committed=$pinned upstream=$latest"
          if [ "$latest" = "$pinned" ]; then
            exit 0
          fi
          if git log -1 --pretty=%B | grep -q 'pin-held'; then
            echo "Stale pin allowed by the pin-held marker."
            exit 0
          fi
          echo "Committed pin $pinned is behind upstream $latest." >&2
          exit 1

  release:
    name: Manual release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Vim
        uses: rhysd/action-setup-vim@v1
      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
      - name: Install themis
        run: make vendor/vim-themis/bin/themis
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Refresh, test, and commit
        run: make release
      - name: Push the release commit
        run: git push origin HEAD:${{ github.ref_name }}
      - name: Create and push the tag
        run: |
          git tag "${{ inputs.tag }}"
          git push origin "${{ inputs.tag }}"
