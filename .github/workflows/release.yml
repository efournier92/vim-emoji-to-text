name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, for example v0.1.0"
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pin-guard:
    name: Pin guard
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Fail when the committed pin is behind upstream
        timeout-minutes: 5
        run: |
          latest=$(python3 -c "import sys; sys.path.insert(0, 'tools'); import refresh_map as r; print(r.select_latest_tag(r.fetch_tags())['name'])")
          pinned=$(python3 -c "import sys; sys.path.insert(0, 'tools'); import generate_map as g; print(g.SOURCE_TAG)")
          echo "committed=$pinned upstream=$latest"
          if [ "$latest" = "$pinned" ]; then
            exit 0
          fi
          if git log -1 --pretty=%B | grep -q 'pin-held'; then
            echo "Stale pin allowed by the pin-held marker."
            exit 0
          fi
          echo "Committed pin $pinned is behind upstream $latest." >&2
          exit 1

  release:
    name: Manual release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Vim
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          version: v9.2.1167
      - name: Install Neovim
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: v0.12.5
      - name: Cache themis
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/vim-themis
          key: themis-v1.7.0-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            themis-v1.7.0-${{ runner.os }}-
      - name: Install themis
        timeout-minutes: 5
        run: make vendor/vim-themis/bin/themis
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Refresh, test, and commit
        timeout-minutes: 10
        run: make release
      - name: Push the release commit
        run: git push origin HEAD:${{ github.event.repository.default_branch }}
      - name: Create and push the tag
        run: |
          git tag "${{ inputs.tag }}"
          git push origin "${{ inputs.tag }}"
